[project]
name = "nimbus-ticketing-agent"
version = "0.1.0"
description = "Agentic Support Ticket Triage with Approval Gate (Nimbus SaaS) — backend"
readme = "README.md"
authors = [
    { name = "Mitul M.", email = "mitulmungase123@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "psycopg[binary,pool]>=3.1",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.18",
    "langgraph-checkpoint-postgres>=3.2.0",
    "langchain-core>=1.7.0",
    "tenacity>=9.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0",
    "faker>=30.0",
    "sentence-transformers>=3.0",
    # Declared directly so the CPU-only index below applies to the Linux
    # resolution; on macOS PyPI's wheel is already CPU-only.
    "torch>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.12",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
extend-select = ["B", "SIM", "UP"]
ignore = ["BLE001", "SIM115"]

[tool.mypy]
python_version = "3.14"
strict = false
warn_return_any = true
disallow_untyped_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
exclude = ["^venv/", "^\\.venv/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
markers = ["integration: hits the compose Postgres; skips without TEST_DATABASE_URL"]

[tool.uv]
package = false

# CPU-only torch inside Linux images: the default PyPI wheels pull ~2.5 GB of
# CUDA libraries that this app never uses (embeddings run on CPU). macOS PyPI
# wheels are already CPU-only, hence the linux marker. See docs/DECISIONS.md.
[tool.uv.sources]
torch = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
