# Backend services plus an optional Next.js console.
# `web` is behind a profile because this repo must stay runnable on its own: its
# build context is the SIBLING frontend repo, and a clone without that directory
# would fail to build. Bring the full stack up with:
#   docker compose --profile web up -d --build
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: nimbus
      POSTGRES_PASSWORD: nimbus
      POSTGRES_DB: nimbus
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nimbus -d nimbus"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"          # host access for local tests/debugging; app uses db:5432

  api:
    build: .
    image: nimbus-backend:latest
    ports:
      - "8000:8000"
    volumes:
      - hf_cache:/srv/hf          # matches HF_HOME in the image
    environment:
      DATABASE_URL: postgresql://nimbus:nimbus@db:5432/nimbus
      LLM_PROVIDER: ${LLM_PROVIDER:-stub}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      AGENT_TOKEN: ${AGENT_TOKEN:-}
      STEP_LIMIT: ${STEP_LIMIT:-8}
      TOOL_TIMEOUT_S: ${TOOL_TIMEOUT_S:-8}
      REFUND_WINDOW_DAYS: ${REFUND_WINDOW_DAYS:-30}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')\" || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 60

  worker:
    build: .
    image: nimbus-backend:latest
    command: ["/srv/.venv/bin/python", "-m", "app.worker"]
    volumes:
      - hf_cache:/srv/hf          # matches HF_HOME in the image
    environment:
      DATABASE_URL: postgresql://nimbus:nimbus@db:5432/nimbus
      LLM_PROVIDER: ${LLM_PROVIDER:-stub}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      AGENT_TOKEN: ${AGENT_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy

  # Next.js console (separate repo, read-only for the UI work). Server-side only:
  # the browser talks to this container, which proxies to `api` with the bearer
  # token. NIMBUS_API_URL must be the compose service name, not localhost.
  web:
    profiles: ["web"]
    build:
      context: ../saas-ticketing-agentic-sm-next-app
      dockerfile: Dockerfile
    image: nimbus-console:latest
    ports:
      - "3000:3000"
    environment:
      NIMBUS_API_URL: http://api:8000
      AGENT_TOKEN: ${AGENT_TOKEN:-}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # node:slim has no curl/wget; Node 22's fetch is enough for a liveness check.
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  pgdata:
  hf_cache:
